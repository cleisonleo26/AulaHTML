<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

h1{
    background-color: blue;
    color: aquamarine;
    text-align: center;
}
 
  table, th, td
{ 
 border: 1px solid rgb(255,26 ,236);
 border-collapse: collapse;
 padding: 5px;
 text-align: left;
}   



</style>




</head>
<body>
 
<h1>aula 5 - exercicio 2 de tabelas </h1>  

<table>

<tr>
<td rowspan="4">produtos</td>

</tr>

<tr>
<th>categoria</th>
<th>produtos</th>
<th>preço</th>
<th>estoque</th>

</tr>

<tr>
<th rowspan="2">eletronicos</th>
<th>notebook</th>
<th>R$ 3,500</th>
<th>5</th>

</tr>

<tr>

<th>mouse</th>
<th>R$ 80</th>
<th>12</th>

</tr>
<tr>
<th rowspan="2">informatica</th>
<th>teclado</th>
<th>R$ 150</th>
<th>8</th>

</tr>
<tr>
<th>monitor</th>
<th>R$ 900</th>
<th>4</th>
</tr>
<tr>

<th colspan="2">total</th>
<th>4 produtos</th>
<th>20</th>

</tr>

</table>


</body>
</html>
